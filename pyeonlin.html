<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>편린 — beethoven2k</title>
<style>
  :root {
    --bg:#07090f; --bg2:#0d1017; --bg3:#131720;
    --gold:#c8a84b; --gold-dim:#8a7235;
    --teal:#2eb8a0; --teal-dim:#1a6e60;
    --text:#dcd7cc; --muted:#8a8578; --border:#2a2d38;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
    line-height: 1.85;
    min-height: 100vh;
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.1rem 3rem;
    background: rgba(7,9,15,0.97);
    border-bottom: 1px solid var(--border);
    font-family: "Courier New", monospace;
    font-size: 0.78rem; letter-spacing: 0.12em;
  }
  nav .logo { color: var(--gold); text-decoration: none; font-size: 1rem; }
  nav ul { list-style: none; display: flex; gap: 2.5rem; }
  nav a { color: var(--muted); text-decoration: none; text-transform: uppercase; transition: color 0.2s; }
  nav a:hover, nav a.active { color: var(--gold); }

  .wrap { max-width: 860px; margin: 0 auto; padding: 0 2rem; }

  .page-header {
    padding: 8rem 0 3rem;
    border-bottom: 1px solid var(--border);
  }
  .sec-label {
    font-family: "Courier New", monospace;
    font-size: 0.7rem; letter-spacing: 0.25em;
    color: var(--gold-dim); text-transform: uppercase;
    margin-bottom: 0.6rem;
  }
  .page-header h1 {
    font-size: 2.8rem; font-weight: 400;
    color: #f0ece0; margin-bottom: 0.4rem;
    letter-spacing: 0.04em;
  }
  .page-header .hanja {
    font-size: 0.85rem; color: var(--muted);
    font-family: "Courier New", monospace;
    letter-spacing: 0.1em; margin-bottom: 1rem;
  }
  .page-header p { color: var(--muted); font-size: 0.95rem; max-width: 500px; }
  .rule { width: 48px; height: 1px; background: var(--gold); margin: 1rem 0; }

  /* 글 목록 */
  .post-list { padding: 3rem 0 6rem; }

  .post-item {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 2rem;
    padding: 2rem 0;
    border-bottom: 1px solid var(--border);
    align-items: start;
    transition: background 0.15s;
  }
  .post-item:first-child { border-top: 1px solid var(--border); }
  .post-item:hover { background: rgba(200,168,75,0.02); padding-left: 0.5rem; }

  .post-date {
    font-family: "Courier New", monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    padding-top: 0.2rem;
    line-height: 1.6;
  }
  .post-body {}
  .post-title {
    font-size: 1.15rem;
    font-weight: 400;
    color: #f0ece0;
    text-decoration: none;
    display: block;
    margin-bottom: 0.5rem;
    transition: color 0.2s;
    line-height: 1.45;
  }
  .post-title:hover { color: var(--gold); }
  .post-excerpt {
    font-size: 0.88rem;
    color: var(--muted);
    line-height: 1.75;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .post-tags {
    display: flex; gap: 0.5rem; margin-top: 0.7rem; flex-wrap: wrap;
  }
  .post-tag {
    font-family: "Courier New", monospace;
    font-size: 0.62rem;
    padding: 0.15rem 0.55rem;
    border: 1px solid var(--border);
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* 빈 상태 */
  .empty-state {
    padding: 5rem 0;
    text-align: center;
  }
  .empty-state .empty-symbol {
    font-size: 2rem;
    color: var(--gold-dim);
    margin-bottom: 1rem;
    font-family: "Courier New", monospace;
  }
  .empty-state p {
    font-size: 0.88rem;
    color: var(--muted);
    line-height: 1.9;
  }

  footer {
    padding: 2.5rem 0;
    border-top: 1px solid var(--border);
    text-align: center;
    font-family: "Courier New", monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.12em;
  }

  @media (max-width: 600px) {
    nav { padding: 1rem 1.2rem; }
    nav ul { gap: 1.2rem; }
    .post-item { grid-template-columns: 1fr; gap: 0.4rem; }
    .page-header { padding: 7rem 0 2.5rem; }
  }
</style>
</head>
<body>

  <ul>

    <li><a href="pyeonlin.html" class="active">편린</a></li>
  </ul>
</nav>

<div class="wrap">
  <div class="page-header">
    <div class="sec-label">Personal Writing</div>
    <h1>편린</h1>
    <div class="hanja">片鱗 — 한 조각의 비늘, 전체를 가늠케 하는 단편</div>
    <div class="rule"></div>
    <p>수학도, 일도, 삶도 아닌 — 그냥 나의 이야기. 정제되지 않은 채로 남겨두는 기록들.</p>
  </div>

  <div class="post-list" id="post-list">

    </div>

</div>

<footer>© 2025 · beethoven2k.github.io</footer>

</body>
</html>
