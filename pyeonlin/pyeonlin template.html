<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글 제목 — 편린</title>
<style>
  :root {
    --bg:#07090f; --bg2:#0d1017; --bg3:#131720;
    --gold:#c8a84b; --gold-dim:#8a7235;
    --teal:#2eb8a0;
    --text:#dcd7cc; --muted:#8a8578; --border:#2a2d38;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
    line-height: 2;
    min-height: 100vh;
  }

  nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(7,9,15,0.97);
    border-bottom: 1px solid var(--border);
    padding: .85rem 2rem;
    display: flex; align-items: center; gap: 1.5rem;
  }
  .back {
    font-family: "Courier New", monospace;
    font-size: .75rem; letter-spacing: .12em;
    color: var(--muted); text-decoration: none;
    text-transform: uppercase; transition: color .2s;
  }
  .back:hover { color: var(--gold); }
  .back::before { content: "← "; }
  .nav-label {
    font-family: "Courier New", monospace;
    font-size: .75rem; color: var(--muted);
    letter-spacing: .1em;
  }

  article {
    max-width: 640px;
    margin: 5rem auto 8rem;
    padding: 0 1.5rem;
  }

  /* 헤더 */
  .post-header { margin-bottom: 3rem; }
  .post-meta {
    font-family: "Courier New", monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 1.2rem;
    display: flex; gap: 1.2rem; flex-wrap: wrap;
  }
  h1 {
    font-size: 2rem; font-weight: 400;
    color: #f0ece0; line-height: 1.3;
    margin-bottom: 1rem;
  }
  .post-lead {
    font-size: 1.05rem;
    color: var(--muted);
    font-style: italic;
    line-height: 1.85;
    border-left: 2px solid var(--gold-dim);
    padding-left: 1.2rem;
  }

  /* 본문 */
  .post-body p {
    margin-bottom: 1.6rem;
    font-size: 1rem;
    color: var(--text);
    line-height: 2.05;
  }
  .post-body h2 {
    font-size: 1.2rem; font-weight: 400;
    color: #e8e4d8;
    margin: 2.8rem 0 1rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }
  .post-body strong { color: #f0ece0; }
  .post-body em { color: var(--gold-dim); font-style: italic; }
  .post-body hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2.5rem 0;
  }
  .post-body blockquote {
    border-left: 2px solid var(--gold-dim);
    padding: 0.6rem 1.4rem;
    margin: 1.8rem 0;
    color: var(--muted);
    font-style: italic;
    line-height: 1.85;
  }

  /* 태그 */
  .post-tags {
    display: flex; gap: 0.6rem; flex-wrap: wrap;
    margin-top: 3rem; padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }
  .post-tag {
    font-family: "Courier New", monospace;
    font-size: 0.65rem;
    padding: 0.2rem 0.6rem;
    border: 1px solid var(--border);
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* 이전/다음 */
  .post-nav {
    display: flex; justify-content: space-between;
    margin-top: 3rem; padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    font-family: "Courier New", monospace;
    font-size: 0.75rem;
  }
  .post-nav a {
    color: var(--muted); text-decoration: none;
    transition: color 0.2s;
  }
  .post-nav a:hover { color: var(--gold); }
  .post-nav .prev::before { content: "← "; }
  .post-nav .next::after  { content: " →"; }
</style>
</head>
<body>

<nav>
  <a class="back" href="../pyeonlin.html">편린으로</a>
  <span class="nav-label">편린 · 片鱗</span>
</nav>

<article>
  <header class="post-header">
    <div class="post-meta">
      <span>2026.05.12</span>
      <span>월요일</span>
    </div>
    <h1>글 제목</h1>
    <p class="post-lead">
      첫 문장 혹은 핵심 문장을 여기에 씁니다. 독자가 읽을지 말지 결정하는 문장.
    </p>
  </header>

  <div class="post-body">

    <p>본문이 여기서 시작됩니다. 자유롭게 쓰시면 됩니다.</p>

    <p>단락은 이렇게 나눕니다.</p>

    <blockquote>인용이나 특별히 남기고 싶은 문장은 이렇게.</blockquote>

    <p>계속 이어집니다.</p>

  </div>

  <div class="post-tags">
    <span class="post-tag">일상</span>
  </div>

  <div class="post-nav">
    <a class="prev" href="#">이전 글</a>
    <a class="next" href="#">다음 글</a>
  </div>
</article>

</body>
</html>
